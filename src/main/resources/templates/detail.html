<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일기 상세보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Pretendard', sans-serif; padding: 50px 0; }
        .detail-card {
            max-width: 800px; margin: auto; background: white;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden; padding: 40px;
        }
        .diary-img {
            width: 100%; max-height: 500px; object-fit: contain;
            background: #f9f9f9; border-radius: 15px; margin-bottom: 30px;
        }
        .content-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.8; font-size: 1.1rem; color: #333;
        }
        .btn-back { border-radius: 10px; padding: 10px 25px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="detail-card">
        <h1 class="fw-bold mb-1" th:text="${diary.title}">일기 제목</h1>

        <p class="text-muted small mb-4" th:if="${diary.createdAt != null}">
            📅 작성 시간: <span th:text="${#temporals.format(diary.createdAt, 'yyyy-MM-dd HH:mm')}">2026-02-08 00:00</span>
        </p>

        <hr class="my-4">

        <div th:if="${diary.fileName != null}" class="text-center">
            <img th:src="@{'/uploads/' + ${diary.fileName}}" class="diary-img">
        </div>

        <div class="content-text mb-5" th:text="${diary.content}">
            일기 내용이 여기에 들어갑니다.
        </div>

        <div class="d-flex justify-content-between border-top pt-4">
            <div>
                <a href="/" class="btn btn-outline-secondary btn-back me-2">⬅ 목록</a>
                <a th:href="@{'/edit/' + ${diary.id}}" class="btn btn-warning btn-back text-white">✏️ 수정</a>
            </div>
            <a th:href="@{'/delete/' + ${diary.id}}" class="btn btn-danger btn-back"
               onclick="return confirm('정말 삭제하시겠습니까?')">삭제</a>
        </div>
    </div>
</div>

</body>
</html>
