<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>일기 수정하기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container" style="max-width: 600px;">
    <div class="card p-4 shadow-sm border-0">
        <h3 class="mb-4">✏️ 일기 수정</h3>
        <form action="/update" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${diary.id}">

            <label class="form-label">제목</label>
            <input type="text" name="title" class="form-control mb-3" th:value="${diary.title}" required>

            <label class="form-label">사진 변경 (선택)</label>
            <input type="file" name="file" class="form-control mb-3">

            <label class="form-label">내용</label>
            <textarea name="content" class="form-control mb-4" rows="10" th:text="${diary.content}" required></textarea>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">수정 완료</button>
                <a th:href="@{'/diary/' + ${diary.id}}" class="btn btn-light">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
