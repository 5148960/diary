server:
  port: 8080

spring:
  # --- 여기서부터 추가된 내용입니다 ---
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # ------------------------------
  datasource:
    url: jdbc:h2:mem:diarydb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  mvc:
    static-path-pattern: /uploads/**
  web:
    resources:
      static-locations: classpath:/static/, file:./src/main/resources/static/

file:
  upload-dir: uploads